# Big portals with pollable public careers-search JSON endpoints.
# Microsoft's and Google's public search endpoints are dead (moved/cert-broken)
# — both are on manual_watch until a reliable endpoint is found.
portals:
  microsoft: { enabled: false, query: research intern }
  google: { enabled: false, query: research intern }
  amazon: { enabled: true, query: research intern }

# Sites we can't poll reliably — surfaced in every daily digest instead.
manual_watch:
  - { company: Meta (FAIR/GenAI), url: "https://www.metacareers.com/jobs?q=research%20intern" }
  - { company: Apple (AIML), url: "https://jobs.apple.com/en-us/search?search=machine%20learning%20research%20intern" }
  - { company: Microsoft Research, url: "https://jobs.careers.microsoft.com/global/en/search?q=research%20intern" }

aggregators:
  remotive: { enabled: true }
  hn_whoishiring: { enabled: true }
  adzuna: { enabled: false }        # enable after keys in .env
  github_repos: { enabled: true, search: "research internships 2027 OR PhD internships list" }

# Optional overrides for scoring.py defaults (uncomment to customise):
# scoring:
#   research_keywords:            # [regex, points], capped at 50 total
#     - ["world\\s+model", 14]
#     - ["imitation\\s+learning|robot\\s+learning", 14]
#     - ["interpretab|mechanistic", 12]
#   preferred_locations: "san\\s+francisco|bay\\s+area|palo\\s+alto"

# Target terms for timing-fit scoring (from profile answers)
target_terms: ["Summer 2027", "Fall 2026"]

tailoring:
  model: claude-sonnet-5
  max_letter_words: 300
  statement_min_words: 150
  statement_max_words: 400

dashboard:
  host: 127.0.0.1
  port: 8787

# ============================================================
# jobbot configuration — KITS MODE (2026-09-18): find, score, prepare, email; the user submits.
# auto_apply is off. Flip it to true to resume Greenhouse/Lever/Ashby auto-submits.
#
# Anthropic carve-out: watched + scored + instant alerts, but NEVER
# auto-applied (listed in profile.yaml never_apply_companies). Their
# applicant policy prohibits AI-generated application content and their
# forms require attesting you've read it. Anthropic is applied to by hand
# from the draft kit:  python -m jobbot.draftkit
# ============================================================

# MODE: KITS (2026-09-18). The bot finds, scores, and prepares; the user submits.
# Every morning: one email per qualifying posting with the link, attached
# tailored materials, and a field-by-field answer sheet scanned from the form.
auto_apply: false

kits:
  enabled: true
  threshold: 65      # postings at/above this get a kit
  per_day: 5         # highest-scoring first; the rest roll to tomorrow

score_threshold: 70
discovery_interval_hours: 2

limits:
  max_submissions_per_day: 5
  max_per_company_per_week: 2
  delay_min_seconds: 180     # 3 min
  delay_max_seconds: 600     # 10 min
  company_title_dedupe_days: 90

# Companies whose new matching postings trigger an instant email alert.
top_tier: [Physical Intelligence, Anthropic, OpenAI, Google DeepMind, xAI, Meta (FAIR/GenAI), Microsoft Research]

# Companies whose non-'intern' research titles (Fellows Program, Research
# Engineer/Scientist, Residency) should still be tracked. Elsewhere the
# matcher stays internship-only so the bot never auto-applies to senior
# full-time roles.
broad_title_companies: [Anthropic]


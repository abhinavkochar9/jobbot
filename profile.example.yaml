# profile.example.yaml — copy to profile.yaml and fill in.
#
# This file is the SINGLE SOURCE OF TRUTH for everything the bot says about you:
# every resume bullet, cover-letter claim, and screening answer must trace back
# here. Tailoring may SELECT and ORDER these facts per job; it may never invent.
# profile.yaml is git-ignored — it holds personal data. Keep it that way.
#
# Structure mirrors a CV: contact, summary, education, publications, experience,
# projects (each with `tags` used for job matching), skills, leadership, awards,
# then `research_areas_priority` (drives scoring) and `application_answers`
# (standing rules for screening questions — wrong answers here silently kill
# applications, so never leave them as guesses).
